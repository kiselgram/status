<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kiselgram — Status</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0d1117; color: #c9d1d9;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; padding: 40px 20px;
  }
  .container { max-width: 640px; width: 100%; }
  h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 4px; }
  .subtitle { color: #8b949e; font-size: 0.9rem; margin-bottom: 8px; }
  .card {
    background: #161b22; border: 1px solid #30363d; border-radius: 8px;
    padding: 20px; margin-bottom: 16px;
  }
  .card h2 { font-size: 1rem; font-weight: 500; margin-bottom: 12px; }
  .service { display: flex; align-items: center; gap: 12px; padding: 10px 0; }
  .service + .service { border-top: 1px solid #21262d; }
  .status-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .status-dot.up { background: #3fb950; box-shadow: 0 0 6px #3fb950; }
  .status-dot.down { background: #f85149; box-shadow: 0 0 6px #f85149; }
  .status-dot.checking { background: #d29922; animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  .service-name { flex: 1; font-size: 0.9rem; font-weight: 500; }
  .service-status { font-size: 0.8rem; }
  .service-status.up { color: #3fb950; }
  .service-status.down { color: #f85149; }
  .service-status.checking { color: #d29922; }
  .service-latency { font-size: 0.75rem; color: #484f58; min-width: 50px; text-align: right; }
  .footer { margin-top: 16px; font-size: 0.8rem; color: #484f58; text-align: center; }
  .last-check { margin-top: 8px; font-size: 0.75rem; color: #484f58; }
  a { color: #58a6ff; text-decoration: none; }
  a:hover { text-decoration: underline; }
  .overall-banner {
    text-align: center; padding: 12px 20px; border-radius: 8px; margin-bottom: 16px;
    font-size: 0.95rem; font-weight: 600;
  }
  .overall-banner.all-up { background: #102e1a; border: 1px solid #238636; color: #3fb950; }
  .overall-banner.some-down { background: #2e1010; border: 1px solid #da3633; color: #f85149; }
</style>
</head>
<body>
<div class="container">
  <h1>Kiselgram</h1>
  <p class="subtitle">Service Status</p>
  <div id="overall" class="overall-banner">Checking services…</div>
  <div class="card" id="services"></div>
  <p class="last-check" id="lastCheck"></p>
  <div class="footer">
    <a href="https://kiselgram.ru">kiselgram.ru</a> &middot;
    <a href="https://web.kiselgram.ru">Web App</a> &middot;
    <a href="https://docs.kiselgram.ru">Docs</a>
  </div>
</div>
<script>
const SERVICES = [
  { id: 'web', name: 'Web App', check: () => ping('https://kiselgram.ru/') },
  { id: 'api', name: 'API', check: () => ping('https://api.kiselgram.ru/api.v2/api/') },
  { id: 'cdn', name: 'CDN', check: () => ping('https://cdn.kiselgram.ru/') },
  { id: 'video', name: 'Video Calls', check: () => wsCheck('wss://web.kiselgram.ru/socket.io/?EIO=4&transport=websocket') },
  { id: 'email', name: 'Email', check: () => ping('https://kiselgram.ru/mailadmin/') },
  { id: 'mailadmin', name: 'Mail Admin', check: () => ping('https://kiselgram.ru/mailadmin/api/accounts') },
];

function ping(url, timeoutMs = 8000) {
  const start = performance.now();
  return new Promise(resolve => {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeoutMs);
    fetch(url, { method: 'HEAD', mode: 'no-cors', signal: controller.signal })
      .then(() => {
        clearTimeout(timer);
        resolve({ up: true, latency: Math.round(performance.now() - start) });
      })
      .catch(() => {
        clearTimeout(timer);
        resolve({ up: false, latency: null });
      });
  });
}

function wsCheck(url, timeoutMs = 6000) {
  const start = performance.now();
  return new Promise(resolve => {
    const ws = new WebSocket(url);
    const timer = setTimeout(() => {
      ws.close();
      resolve({ up: false, latency: null });
    }, timeoutMs);
    ws.onopen = () => {
      clearTimeout(timer);
      resolve({ up: true, latency: Math.round(performance.now() - start) });
      ws.close();
    };
    ws.onerror = () => {
      clearTimeout(timer);
      resolve({ up: false, latency: null });
    };
  });
}

function render() {
  const container = document.getElementById('services');
  container.innerHTML = SERVICES.map(s => `
    <div class="service" id="svc-${s.id}">
      <span class="status-dot checking"></span>
      <span class="service-name">${s.name}</span>
      <span class="service-status checking">Checking…</span>
      <span class="service-latency"></span>
    </div>
  `).join('');
}

function updateService(id, result) {
  const el = document.getElementById(`svc-${id}`);
  if (!el) return;
  const dot = el.querySelector('.status-dot');
  const status = el.querySelector('.service-status');
  const lat = el.querySelector('.service-latency');
  const up = result.up;
  dot.className = `status-dot ${up ? 'up' : 'down'}`;
  status.textContent = up ? 'Operational' : 'Down';
  status.className = `service-status ${up ? 'up' : 'down'}`;
  lat.textContent = up ? `${result.latency}ms` : '';
}

function updateOverall() {
  const allUp = SERVICES.every(s => s.lastResult && s.lastResult.up === true);
  const anyChecked = SERVICES.some(s => s.lastResult !== undefined);
  const banner = document.getElementById('overall');
  if (!anyChecked) {
    banner.textContent = 'Checking services…';
    banner.className = 'overall-banner';
    return;
  }
  if (allUp) {
    banner.textContent = '✓ All systems operational';
    banner.className = 'overall-banner all-up';
  } else {
    const down = SERVICES.filter(s => s.lastResult && !s.lastResult.up).map(s => s.name).join(', ');
    banner.textContent = `⚠ Service disruption: ${down}`;
    banner.className = 'overall-banner some-down';
  }
}

async function checkAll() {
  render();
  document.getElementById('lastCheck').textContent = 'Checking…';
  const results = await Promise.allSettled(
    SERVICES.map(async s => {
      const result = await s.check();
      s.lastResult = result;
      updateService(s.id, result);
      return result;
    })
  );
  updateOverall();
  document.getElementById('lastCheck').textContent = `Last checked: ${new Date().toLocaleString()}`;
}

render();
checkAll();
setInterval(checkAll, 30000);
</script>
</body>
</html>
